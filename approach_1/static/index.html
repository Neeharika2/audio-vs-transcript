<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approach 1 — Audio vs Transcript</title>
<style>
  :root {
    --bg: #FDF7F2;
    --panel: #FFFFFF;
    --panel-alt: #F8F1EA;
    --border: #E4D7CB;
    --ink: #000000;
    --muted: #625a52;
    --accent: #B72D54;
    --accent-ink: #FFFFFF;
    --danger: #B72D54;
    --ok: #2E7D32;
    --warn: #8A6D00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }

  header.page { margin-bottom: 28px; }
  header.page h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  header.page .sub { color: var(--ink); opacity: .65; font-size: 13px; margin: 0; }
  .nav { display: flex; gap: 14px; font-size: 13px; margin-top: 8px; }
  .nav a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--border); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .panel > .title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-alt);
  }
  .panel > .body { padding: 14px; }

  /* ---------- step 1 ---------- */
  #step-run { padding: 40px 0; text-align: center; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }

  /* ---------- step 2: upload ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .drop {
    border: 1px dashed var(--border);
    padding: 26px 16px;
    text-align: center;
    cursor: pointer;
    background: var(--panel-alt);
    transition: border-color .12s;
  }
  .drop:hover, .drop.has-file { border-color: var(--accent); }
  .drop .drop-title { font-weight: 600; }
  .drop .drop-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .drop .drop-name { color: var(--accent); font-size: 12px; word-break: break-all; margin-top: 4px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  /* ---------- buttons ---------- */
  .btn {
    font: inherit;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 8px 18px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { background: #C9A6B3; border-color:#C9A6B3; color:#fff; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--panel-alt); filter: none; }
  .btn-lg { font-size: 15px; padding: 10px 26px; }

  #status { margin-top: 14px; color: var(--muted); font-size: 13px; }
  #status.error { color: var(--danger); }

  .bar { height: 3px; background: var(--panel-alt); margin-top: 12px; position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0; background: var(--accent); width: 30%; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(400%);} }

  /* ---------- results ---------- */
  .score-line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .score { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score .of { font-size: 13px; color: var(--muted); font-weight: 500; }

  .tag {
    display: inline-block;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    border: 1px solid currentColor;
  }
  .tag.match { color: var(--ok); }
  .tag.mismatch { color: var(--danger); }
  .tag.neutral { color: var(--ink); }

  /* findings table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .sev { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .sev.low { color: var(--ok); }
  .sev.medium { color: var(--warn); }
  .sev.high { color: var(--danger); }
  .sev.critical { color: var(--danger); font-weight: 700; }
  .finding-why { color: var(--muted); font-size: 12.5px; }
  .side { margin: 2px 0; }
  .side .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-right: 6px; }
  .empty-row { color: var(--muted); padding: 12px 10px; font-style: italic; }

  /* tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tabs button {
    font: inherit; font-size: 12.5px; font-weight: 600;
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 9px 14px; cursor: pointer; color: var(--muted);
  }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tabpanel { padding-top: 14px; }
  .tabpanel[hidden] { display: none; }

  .kv { display: grid; grid-template-columns: 220px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv div { padding: 3px 0; border-bottom: 1px dotted var(--border); }
  .kv .k { color: var(--muted); }
  .kv .v { font-variant-numeric: tabular-nums; }
  .kv .v.mono { white-space: pre-wrap; word-break: break-word; }

  .h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
       margin: 18px 0 8px; color: var(--ink); }
  .h:first-child { margin-top: 0; }
</style>
</head>
<body>
<main class="container">
  <header class="page">
    <h1>Approach 1 — New evaluation</h1>
    <p class="sub">Transcribe audio with an STT model and compare the result against a human reference transcript.</p>
    <div class="nav"><a href="/">← Review</a><a href="/framework">Framework validation →</a></div>
  </header>

  <section id="step-start" class="panel">
    <button id="btn-run" class="btn btn-lg" type="button">New evaluation</button>
    <p class="hint">Provide an audio file and a manual transcript (PDF or TXT).</p>
  </section>

  <section id="step-upload" class="panel" hidden>
    <div class="panel-body" style="padding:14px;">
      <div class="grid">
        <label class="drop" id="drop-audio">
          <input type="file" id="file-audio" hidden>
          <span class="drop-title">Audio</span>
          <span class="drop-sub">wav / mp3 / m4a …</span>
        </label>
        <label class="drop" id="drop-transcript">
          <input type="file" id="file-transcript" accept=".pdf,.txt" hidden>
          <span class="drop-title">Reference transcript</span>
          <span class="drop-sub">PDF or TXT</span>
        </label>
      </div>
      <button id="btn-start" class="btn" disabled>Evaluate</button>
      <div id="status"></div>
    </div>
  </section>

  <section id="result" hidden>
    <div class="panel">
      <div class="panel-title" style="padding:10px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);background:var(--panel-alt);">Results</div>
      <div class="panel-body" style="padding:14px;">
        <div id="res-summary"></div>
        <div class="tabs">
          <button data-tab="findings" class="active">Findings</button>
          <button data-tab="breakdown">Score breakdown</button>
          <button data-tab="signals">Signals</button>
          <button data-tab="alignment">Alignment</button>
        </div>
        <div class="tabpanel" data-panel="findings"></div>
        <div class="tabpanel" data-panel="scores" hidden></div>
        <div class="tabpanel" data-panel="signals" hidden></div>
        <div class="tabpanel" data-panel="alignment" hidden></div>
      </div>
    </div>
  </section>
</main>

<script>
const els = {
  stepStart: document.getElementById("step-start"),
  stepUpload: document.getElementById("step-upload"),
  btnRun: document.getElementById("btn-run"),
  btnStart: document.getElementById("btn-start"),
  fileAudio: document.getElementById("file-audio"),
  fileTranscript: document.getElementById("file-transcript"),
  dropAudio: document.getElementById("drop-audio"),
  dropTranscript: document.getElementById("drop-transcript"),
  status: document.getElementById("status"),
  result: document.getElementById("result"),
};

els.btnRun.addEventListener("click", () => {
  els.stepStart.hidden = true;
  els.stepUpload.hidden = false;
});

function wire(drop, input) {
  input.addEventListener("change", () => {
    if (!input.files.length) return;
    const old = drop.querySelector(".drop-name");
    if (old) old.remove();
    const el = document.createElement("span");
    el.className = "drop-name";
    el.textContent = input.files[0].name;
    drop.appendChild(el);
    drop.classList.add("has-file");
    els.btnStart.disabled = !(els.fileAudio.files.length && els.fileTranscript.files.length);
  });
}
wire(els.dropAudio, els.fileAudio);
wire(els.dropTranscript, els.fileTranscript);

els.btnStart.addEventListener("click", async () => {
  const fd = new FormData();
  fd.append("audio", els.fileAudio.files[0]);
  fd.append("manual_transcript", els.fileTranscript.files[0]);
  els.btnStart.disabled = true;
  els.status.className = "";
  els.status.innerHTML = "Transcribing audio and comparing… <span class='bar'><i></i></span>";
  els.result.hidden = true;
  try {
    const res = await fetch("/evaluate", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) {
      els.status.className = "error";
      els.status.textContent = data.detail || "Evaluation failed.";
    } else {
      els.status.textContent = "";
      render(data);
    }
  } catch (err) {
    els.status.className = "error";
    els.status.textContent = "Request failed: " + err.message;
  } finally {
    els.btnStart.disabled = false;
  }
});

const CATS = [
  ["missing_information", "Missing", "match"],
  ["incorrect_information", "Incorrect", "danger"],
  ["conflicting_information", "Conflicting", "danger"],
  ["hallucinated_information", "Hallucinated", "danger"],
];

const TABS = ["findings", "scores", "signals", "alignment"];

document.querySelectorAll(".tabs button[data-tab]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button[data-tab]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".tabpanel").forEach(p => { p.hidden = true; });
    document.querySelector(`.tabpanel[data-panel="${btn.dataset.tab}"]`).hidden = false;
  });
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function tag(cls, label) {
  return `<span class="tag ${cls}">${esc(label)}</span>`;
}

function renderSummary(data) {
  const counts = CATS.map(([key, label]) =>
    `<span>${(data[key] || []).length} ${label}</span>`).join("");
  const statusCls = data.status === "Match" ? "match" : "mismatch";
  return `
    <div class="score-line">
      <span class="score">${data.overall_score}<span class="of"> / 100</span></span>
      ${tag(statusCls, data.status)}
      <span class="tag neutral">${data.inputs?.stt_model || "stt"}</span>
    </div>
    <div class="score-line">
      ${counts}
      <span>${data.inputs?.gold_source || ""}</span>
      <span>${data.inputs?.candidate_source || ""}</span>
    </div>`;
}

function findingRow(f) {
  return `
    <tr>
      <td class="sev ${f.severity}">${esc(f.severity)}</td>
      <td class="mono">
        ${f.reference_text ? `<div class="side"><span class="lbl">Manual</span>${esc(f.reference_text)}</div>` : ""}
        ${f.generated_text ? `<div class="side"><span class="lbl">STT</span>${esc(f.generated_text)}</div>` : ""}
        ${(!f.reference_text && !f.generated_text) ? "<span class='empty'>(no text)</span>" : ""}
      </td>
      <td>${esc(f.explanation || "")}</td>
    </tr>`;
}

function renderFindings(data) {
  const rows = CATS.map(([key, label]) => (data[key] || [])).flat();
  const body = rows.length
    ? rows.map(f => findingRow(f)).join("")
    : `<tr><td colspan="3" class="empty-row">No findings — transcript and reference produced no discrepancies.</td></tr>`;
  return `
    <table>
      <thead><tr><th style="width:80px;">Severity</th><th style="width:46%;">Text evidence</th><th>Why it was flagged</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

function renderScores(data) {
  const b = data.score_breakdown || {};
  const m = data.meta || {};
  return `
    <div class="kv">
      <div class="k">Overall score</div><div class="v">${data.overall_score} / 100</div>
      <div class="k">Semantic</div><div class="v">${b.semantic ?? "—"}</div>
      <div class="k">Lexical</div><div class="v">${b.lexical ?? "—"}</div>
      <div class="k">Entity</div><div class="v">${b.entity ?? "—"}</div>
      <div class="k">Error penalty</div><div class="v">${b.error_penalty ?? "—"}</div>
      <div class="k">LLM calls</div><div class="v">${m.llm_calls ?? "—"}</div>
      <div class="k">Latency</div><div class="v">${m.latency_ms != null ? m.latency_ms + " ms" : "—"}</div>
      <div class="k">Evaluator model</div><div class="v">${data.inputs?.evaluator || "—"}</div>
    </div>`;
}

function renderSignals(data) {
  const entries = Object.entries(data.signals || {});
  if (!entries.length) return `<div class="empty-row">No signals recorded.</div>`;
  return `<table>
      <thead><tr><th>Metric</th><th>Value</th></tr></thead>
      <tbody>${entries.map(([k, v]) =>
        `<tr><td class="mono">${esc(k)}</td><td class="mono">${v === null ? "—" : esc(v)}</td></tr>`).join("")}</tbody>
    </table>`;
}

function renderAlignment(data) {
  const a = data.alignment || {};
  const kv = [
    ["Gold segments", a.gold_segments],
    ["Candidate segments", a.candidate_segments],
    ["Matched", a.matched],
    ["Unmatched gold", a.unmatched_gold],
    ["Unmatched candidate", a.unmatched_candidate],
    ["Covered gold", a.covered_gold],
  ];
  return `<div class="kv">${kv.map(([k, v]) =>
    `<div><span class="k">${esc(k)}</span></div><div class="v">${v === undefined ? "—" : esc(v)}</div>`).join("")}</div>`;
}

function render(data) {
  els.result.hidden = false;
  document.querySelector("[data-panel='findings']").innerHTML = renderFindings(data);
  document.querySelector("[data-panel='scores']").innerHTML = renderScores(data);
  document.querySelector("[data-panel='signals']").innerHTML = renderSignals(data);
  document.querySelector("[data-panel='alignment']").innerHTML = renderAlignment(data);
  document.getElementById("res-summary").innerHTML = renderSummary(data);
  window.scrollTo({ top: 0, behavior: "instant" });
}
</script>
</body>
</html>
