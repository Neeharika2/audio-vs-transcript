<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approach 2 — Transcript Audit</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f4f4f4; --line:#d9d9d9; --ink:#111; --dim:#6b6b6b;
    --faint:#9a9a9a; --strong:#000;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f0f0f; --panel:#1a1a1a; --line:#2e2e2e; --ink:#ececec;
      --dim:#b0b0b0; --faint:#7a7a7a; --strong:#fff; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:860px; margin:0 auto; padding:20px; }
  header{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-bottom:16px;
         border-bottom:2px solid var(--ink); margin-bottom:16px; }
  header h1{ font-size:16px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin:0; }
  select, button{ font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); }
  select:focus, button:focus{ outline:2px solid var(--ink); }
  button{ cursor:pointer; } button:hover{ background:var(--panel); }
  audio{ width:100%; margin-bottom:16px; }
  #status{ flex:1; text-align:right; color:var(--dim); font-size:13px; }

  /* summary stat cards (monochrome) */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:22px; }
  .stat{ border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--panel); }
  .stat .n{ font-size:28px; font-weight:800; line-height:1; }
  .stat .l{ font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.4px; margin-top:6px; }
  .stat.total .n{ font-size:32px; }
  .stat.zero .n{ color:var(--faint); }

  .msg{ border:1px dashed var(--line); padding:14px; border-radius:8px; color:var(--dim); }

  /* per-category sections */
  .cat{ margin-bottom:26px; }
  .cat h2{ font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
          margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .cat h2 .count{ color:var(--dim); font-weight:600; }
  .item{ border:1px solid var(--line); border-left:3px solid var(--ink); border-radius:8px;
        padding:12px; margin-bottom:10px; background:var(--panel); }
  .item-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .time{ font-variant-numeric:tabular-nums; color:var(--dim); font-size:13px; }
  .sev{ font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--faint);
       border:1px solid var(--line); border-radius:10px; padding:1px 7px; }
  .sev.high, .sev.critical{ font-weight:700; color:var(--strong); border-color:var(--ink); }
  .row{ display:flex; align-items:flex-start; gap:8px; margin:6px 0; line-height:1.5; }
  .row .tag{ min-width:74px; font-size:11px; text-transform:uppercase; letter-spacing:.4px;
            color:var(--faint); padding-top:2px; }
  .row .txt{ flex:1; }
  .row.corrected .txt{ }
  .ex{ color:var(--dim); font-size:13px; margin:6px 0 0 82px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Transcript Audit</h1>
    <select id="files"></select>
    <button id="refresh" onclick="loadReport()">Reload</button>
    <span id="status">Select a file</span>
  </header>

  <audio id="player" controls></audio>

  <div id="summary"></div>
  <div id="content"></div>
</div>

<script>
const audio = document.getElementById("player");
let report = null;

const CATEGORIES = [
  { key: "incorrect",    label: "Incorrect" },
  { key: "missing",      label: "Missing" },
  { key: "hallucinated", label: "Hallucinated" },
  { key: "extra",        label: "Extra" },
  { key: "conflicting",  label: "Conflicting" },
];

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error((await res.text()) || res.status);
  return res.json();
}

async function loadFiles() {
  const files = await api("/files");
  const sel = document.getElementById("files");
  sel.innerHTML = files.map(f => `<option>${f}</option>`).join("");
  sel.onchange = () => loadReport();
  if (files.length) loadReport();
}

function esc(s) { return String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function currentStem() { return document.getElementById("files").value; }

function spokenText(seg) { return seg.engine_a ? seg.engine_a.text : (seg.engine_b ? seg.engine_b.text : ""); }

function bucketize() {
  const buckets = Object.fromEntries(CATEGORIES.map(c => [c.key, []]));
  buckets.accurate = [];
  buckets.unjudged = [];
  for (const seg of report.segments) {
    const j = seg.llm_judgment;
    if (!j) { buckets.unjudged.push(seg); continue; }
    if (buckets[j.classification]) buckets[j.classification].push(seg);
    else buckets["accurate"].push(seg); // any unknown classification -> accurate-ish
  }
  return buckets;
}

function renderStats(buckets) {
  const total = report.segments.length;
  const judged = total - buckets.unjudged.length;
  const counts = {};
  for (const c of CATEGORIES) counts[c.key] = buckets[c.key].length;

  const s = document.getElementById("summary");
  s.innerHTML = `
    <div class="stats">
      <div class="stat total"><div class="n">${total}</div><div class="l">Total segments</div></div>
      ${CATEGORIES.map(c =>
        `<div class="stat ${counts[c.key] === 0 ? "zero" : ""}">` +
        `<div class="n">${counts[c.key]}</div><div class="l">${c.label}</div></div>`
      ).join("")}
      <div class="stat"><div class="n">${judged}</div><div class="l">LLM-judged</div></div>
    </div>`;
}

function itemCard(seg) {
  const j = seg.llm_judgment;
  const text = spokenText(seg);
  const corrected = (j && j.correct_content) ? j.correct_content : null;
  const sev = j ? j.severity : "low";
  const missing = !seg.engine_a || !seg.engine_b;

  const item = document.createElement("div");
  item.className = "item";

  const head = document.createElement("div");
  head.className = "item-head";
  head.innerHTML =
    `<button onclick="playSeg(${seg.start}, ${seg.end})">Play</button>` +
    `<span class="time">${seg.start.toFixed(2)}–${seg.end.toFixed(2)}s</span>` +
    `<span class="sev ${sev}">${sev}</span>` +
    (missing ? `<span class="time">only one engine transcribed</span>` : "");
  item.appendChild(head);

  if (text) {
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = `<span class="tag">Transcript</span><span class="txt">${esc(text)}</span>`;
    item.appendChild(r);
  }
  if (corrected) {
    const r = document.createElement("div");
    r.className = "row corrected";
    r.innerHTML = `<span class="tag">Corrected</span><span class="txt">${esc(corrected)}</span>`;
    item.appendChild(r);
  }
  if (j && j.explanation) {
    const ex = document.createElement("div");
    ex.className = "ex";
    ex.textContent = j.explanation;
    item.appendChild(ex);
  }
  return item;
}

function render() {
  const buckets = bucketize();
  renderStats(buckets);

  const box = document.getElementById("content");
  box.innerHTML = "";

  if (report.segments.length === 0) {
    box.innerHTML = `<div class="msg">No segments for this file.</div>`;
    return;
  }

  let shown = 0;
  for (const c of CATEGORIES) {
    const segs = buckets[c.key];
    if (segs.length === 0) continue;
    shown += segs.length;
    const sec = document.createElement("div");
    sec.className = "cat";
    const h = document.createElement("h2");
    h.innerHTML = `${c.label} <span class="count">(${segs.length})</span>`;
    sec.appendChild(h);
    for (const s of segs) sec.appendChild(renderCard(s));
    box.appendChild(sec);
  }

  if (buckets.accurate.length > 0) {
    const sec = document.createElement("div");
    sec.className = "cat";
    sec.innerHTML = `<h2>Accurate / false alarms <span class="count">(${buckets.accurate.length})</span></h2>`;
    box.appendChild(sec);
  }

  if (buckets.unjudged.length > 0) {
    shown += buckets.unjudged.length;
    const sec = document.createElement("div");
    sec.className = "cat";
    const h = document.createElement("h2");
    h.innerHTML = `Not LLM-judged <span class="count">(${buckets.unjudged.length})</span>`;
    sec.appendChild(h);
    for (const s of buckets.unjudged) sec.appendChild(renderCard(s));
    box.appendChild(sec);
  }

  document.getElementById("status").textContent =
    report.segments.length ? `${shown} of ${report.segments.length} segments shown` : "";
}

function playSeg(start, end) {
  audio.currentTime = Math.max(0, start - 0.05);
  audio.play();
}

async function loadReport() {
  const stem = currentStem();
  if (!stem) return;
  audio.src = `/audio/${stem}`;
  report = await api(`/report/${stem}`);
  render();
}

// alias helpers used above
function renderCard(s) { return itemCard(s); }

loadFiles();
</script>
</body>
</html>
