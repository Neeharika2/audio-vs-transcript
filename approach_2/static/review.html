<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approach 2 — Transcript Audit</title>
<style>
  :root{
    --bg:#FDF7F2; --panel:#FFFFFF; --panel-alt:#F8F1EA; --line:#E4D7CB;
    --ink:#000000; --dim:#625a52; --accent:#B72D54;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; }
  .wrap{ max-width:960px; margin:0 auto; padding:24px 24px 80px; }

  header.page{ margin-bottom:22px; }
  header.page h1{ font-size:22px; font-weight:700; margin:0 0 4px; }
  header.page .sub{ color:var(--dim); font-size:13px; margin:0; }

  .bar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
        padding:10px 14px; border:1px solid var(--line); background:var(--panel); margin-bottom:18px; }
  .bar label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  select, button{ font:inherit; }
  select{
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    padding:6px 10px; border-radius:0; flex:1; min-width:140px;
  }
  .btn{
    font:inherit; border:1px solid var(--accent); background:var(--accent); color:#fff;
    padding:6px 16px; cursor:pointer; font-weight:600;
  }
  .btn:hover{ filter:brightness(1.06); }
  .btn.ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn.ghost:hover{ background:var(--panel-alt); filter:none; }
  #status{ color:var(--dim); font-size:13px; margin-left:auto; }

  audio{ width:100%; margin-bottom:18px; }

  .panel{ border:1px solid var(--line); background:var(--panel); margin-bottom:18px; }
  .panel > .title{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel-alt);
  }
  .panel > .body{ padding:14px; }

  /* summary table */
  table.stats{ width:100%; border-collapse:collapse; font-size:13px; }
  table.stats th, table.stats td{ text-align:left; padding:7px 10px; border-right:1px solid var(--line); }
  table.stats th:last-child, table.stats td:last-child{ border-right:none; }
  table.stats thead th{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); font-weight:600; }
  table.stats td.n{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  table.stats td .u{ font-size:11px; color:var(--dim); font-weight:500; vertical-align:2px; }
  table.stats td.zero .n, table.stats td.zero .u{ color:#AFA69C; }

  .tag{ display:inline-block; padding:1px 8px; font-size:11px; font-weight:700;
        text-transform:uppercase; letter-spacing:.05em; border:1px solid currentColor; }
  .tag.incorrect{ color:#B72D54; } .tag.conflicting{ color:#8A4B2B; }
  .tag.missing{ color:#6D5A00; }   .tag.extra{ color:#B7660F; }
  .tag.hallucinated{ color:#7A3E9D; }
  .tag.accurate{ color:#2E7D32; }
  .tag.unjudged{ color:#8A6D00; border-style:dashed; }
  .tag.none{ color:var(--dim); }

  /* diff chips */
  .chips{ display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 0 82px; }
  .chip{ font:600 12px/1.5 ui-monospace, Menlo, Consolas, monospace; padding:0 6px; border:1px solid var(--line); }
  .chip.ins{ background:#F6E3EA; color:#8C2447; border-color:#D99AAC; }
  .chip.sub{ background:#F6EEE0; color:#7A5A00; border-color:#D8BE7E; }
  .chip.del{ background:#F0E6F6; color:#6A3E8C; border-color:#CBB0DD; }

  /* per-category sections */
  .cat{ margin-bottom:22px; }
  .cat h2{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
           margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  .cat h2 .count{ color:var(--dim); font-weight:600; }
  .item{ border:1px solid var(--line); border-left:3px solid var(--accent); padding:10px 12px; margin-bottom:10px; background:var(--panel); }
  .item .head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:7px; }
  .item .time{ font-variant-numeric:tabular-nums; color:var(--dim); font-size:13px; }
  .item .sev{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
  .item .sev.low{ color:#2E7D32; } .item .sev.medium{ color:#8A6D00; }
  .item .sev.high, .item .sev.critical{ color:var(--accent); font-weight:700; }
  .item .row{ display:flex; align-items:flex-start; gap:8px; margin:4px 0; }
  .item .row .tag{ min-width:74px; font-size:10px; padding-top:2px; }
  .item .row .txt{ flex:1; white-space:pre-wrap; }
  .item .ex{ color:var(--dim); font-size:12.5px; margin:5px 0 0 82px; }

  .msg{ border:1px dashed var(--line); padding:14px; color:var(--dim); }
  .empty-row{ color:var(--dim); font-style:italic; }

  .nav{ margin-left:auto; font-size:13px; }
  .nav a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>Approach 2 — Two-STT Audit</h1>
    <p class="sub">Review segments where two speech-to-text engines disagree; listen to the audio and accept or correct.</p>
    <div class="nav"><a href="/framework">Framework validation →</a></div>
  </header>

  <div class="bar">
    <label for="files">Recording</label>
    <select id="files"></select>
    <button class="btn ghost" id="refresh" onclick="loadReport()">Reload</button>
    <span id="status">Select a file</span>
  </div>

  <audio id="player" controls></audio>

  <div id="summary"></div>
  <div id="content"></div>
</div>

<script>
const audio = document.getElementById("player");
let report = null;

const CATEGORIES = [
  { key: "incorrect",    label: "Incorrect" },
  { key: "missing",      label: "Missing" },
  { key: "hallucinated", label: "Hallucinated" },
  { key: "extra",        label: "Extra" },
  { key: "conflicting",  label: "Conflicting" },
];

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) throw new Error((await res.text()) || res.status);
  return res.json();
}

async function loadFiles() {
  const files = await api("/files");
  const sel = document.getElementById("files");
  sel.innerHTML = files.map(f => `<option>${f}</option>`).join("");
  sel.onchange = () => loadReport();
  if (files.length) loadReport();
}

function esc(s) { return String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function currentStem() { return document.getElementById("files").value; }

function transcriptRows(seg) {
  const rows = [];
  for (const side of [seg.engine_a, seg.engine_b]) {
    if (!side || !side.engine) continue;
    rows.push(`<div class="row"><span class="tag none">${esc(side.engine)}</span><span class="txt">${esc(side.text || "")}</span></div>`);
  }
  return rows.join("");
}

function bucketize() {
  const buckets = Object.fromEntries(CATEGORIES.map(c => [c.key, []]));
  buckets.accurate = [];
  buckets.autoaccepted = [];
  buckets.pending = [];
  for (const seg of report.segments) {
    const j = seg.llm_judgment;
    if (!j) {
      // No verdict. A segment the detector would NOT send to the LLM was
      // auto-accepted and is never judged; one it *would* send is pending.
      (seg.llm_selected ? buckets.pending : buckets.autoaccepted).push(seg);
      continue;
    }
    if (buckets[j.classification]) buckets[j.classification].push(seg);
    else buckets["accurate"].push(seg); // any unknown classification -> accurate-ish
  }
  return buckets;
}

function renderStats(buckets) {
  const total = report.segments.length;
  const judged = total - buckets.pending.length - buckets.autoaccepted.length;
  const counts = {};
  for (const c of CATEGORIES) counts[c.key] = buckets[c.key].length;

  document.getElementById("summary").innerHTML = `
    <div class="panel">
      <div class="title">Summary</div>
      <div class="body" style="padding:0;">
        <table class="stats">
          <thead><tr>
            <th>Segments</th>
            <th>LLM-judged</th>
            ${CATEGORIES.map(c => `<th>${c.label}</th>`).join("")}
            <th>No issue / verified</th>
            <th>Auto-accepted</th>
            <th>Unjudged</th>
          </tr></thead>
          <tbody><tr>
            <td class="n">${total}</td>
            <td class="n">${judged}</td>
            ${CATEGORIES.map(c => `<td class="n ${counts[c.key] === 0 ? "zero" : ""}">${counts[c.key]}</td>`).join("")}
            <td class="n ${buckets.accurate.length === 0 ? "zero" : ""}">${buckets.accurate.length}</td>
            <td class="n ${buckets.autoaccepted.length === 0 ? "zero" : ""}">${buckets.autoaccepted.length}</td>
            <td class="n ${buckets.pending.length === 0 ? "zero" : ""}">${buckets.pending.length}</td>
          </tr></tbody>
        </table>
      </div>
    </div>`;
}

function chunkRows(diff) {
  if (!diff || !diff.length) return "";
  const chips = diff.map(d => {
    const which = d.text || d.a || d.b || "";
    const cls = d.op === "insert" ? "ins" : (d.op === "delete" ? "del" : "sub");
    const glyph = d.op === "insert" ? "+" : (d.op === "delete" ? "−" : "~");
    return `<span class="chip ${cls}">${glyph}${esc(which)}</span>`;
  }).join("");
  return `<div class="chips">${chips}</div>`;
}

function itemCard(seg, section) {
  const j = seg.llm_judgment;
  const corrected = (j && j.correct_content) ? j.correct_content : null;
  const sev = j ? j.severity : "low";
  const missing = !seg.engine_a || !seg.engine_b;
  const autoAccepted = !j && !seg.llm_selected;
  const pending = !j && seg.llm_selected;
  const cls = j ? (j.classification || "accurate") : (autoAccepted ? "accurate" : "unjudged");

  const meta = [];
  if (seg.agreement != null) meta.push(`agreement ${Math.round(seg.agreement * 100)}%`);
  if (seg.tier) meta.push(`tier ${seg.tier}`);
  if (seg.confidence != null) meta.push(`conf ${Math.round(seg.confidence)}`);

  const item = document.createElement("div");
  item.className = "item";

  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML =
    `<button class="btn ghost" style="padding:3px 10px;" onclick="playSeg(${seg.start}, ${seg.end})">Play</button>` +
    `<span class="time">${seg.start.toFixed(2)}–${seg.end.toFixed(2)}s</span>` +
    `<span class="tag ${cls}">${j ? cls : (autoAccepted ? "auto-accepted" : "unjudged")}</span>` +
    (j ? `<span class="sev ${sev}">${sev}</span>` : (meta.length ? `<span class="time">${meta.join(" · ")}</span>` : "")) +
    (missing ? `<span class="time">only one engine transcribed</span>` : "");
  item.appendChild(head);

  item.insertAdjacentHTML("beforeend", transcriptRows(seg));
  item.insertAdjacentHTML("beforeend", chunkRows(seg.diff));
  if (corrected) {
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = `<span class="tag none">Corrected</span><span class="txt">${esc(corrected)}</span>`;
    item.appendChild(r);
  }
  if (j && j.explanation) {
    const ex = document.createElement("div");
    ex.className = "ex";
    ex.textContent = j.explanation;
    item.appendChild(ex);
  }
  return item;
}

function render() {
  const buckets = bucketize();
  renderStats(buckets);

  const box = document.getElementById("content");
  box.innerHTML = "";

  if (report.segments.length === 0) {
    box.innerHTML = `<div class="msg">No segments for this file.</div>`;
    return;
  }

  let shown = 0;
  for (const c of CATEGORIES) {
    const segs = buckets[c.key];
    if (segs.length === 0) continue;
    shown += segs.length;
    const sec = document.createElement("div");
    sec.className = "cat";
    const h = document.createElement("h2");
    h.innerHTML = `<span class="tag ${c.key}">${c.label}</span><span class="count">(${segs.length})</span>`;
    sec.appendChild(h);
    for (const s of segs) sec.appendChild(renderCard(s));
    box.appendChild(sec);
  }

  if (buckets.accurate.length > 0) {
    shown += buckets.accurate.length;
    const sec = document.createElement("div");
    sec.className = "cat";
    sec.innerHTML = `<h2><span class="tag accurate">No Issue</span><span class="count">(${buckets.accurate.length}) — verified against audio</span></h2>`;
    for (const s of buckets.accurate) sec.appendChild(renderCard(s, "accurate"));
    box.appendChild(sec);
  }

  if (buckets.autoaccepted.length > 0) {
    shown += buckets.autoaccepted.length;
    const sec = document.createElement("div");
    sec.className = "cat";
    const h = document.createElement("h2");
    h.innerHTML = `<span class="tag accurate">Auto-accepted</span><span class="count">(${buckets.autoaccepted.length}) — never sent to the LLM</span>`;
    sec.appendChild(h);
    for (const s of buckets.autoaccepted) sec.appendChild(renderCard(s, "autoaccepted"));
    box.appendChild(sec);
  }

  if (buckets.pending.length > 0) {
    shown += buckets.pending.length;
    const sec = document.createElement("div");
    sec.className = "cat";
    const h = document.createElement("h2");
    h.innerHTML = `Unjudged — sent to LLM but no verdict yet <span class="count">(${buckets.pending.length})</span>`;
    sec.appendChild(h);
    for (const s of buckets.pending) sec.appendChild(renderCard(s, "pending"));
    box.appendChild(sec);
  }

  document.getElementById("status").textContent =
    report.segments.length ? `${shown} of ${report.segments.length} segments shown` : "";
}

function playSeg(start, end) {
  audio.currentTime = Math.max(0, start - 0.05);
  audio.play();
}

async function loadReport() {
  const stem = currentStem();
  if (!stem) return;
  audio.src = `/audio/${stem}`;
  report = await api(`/report/${stem}`);
  render();
}

// alias helpers used above
function renderCard(s, section) { return itemCard(s, section); }

loadFiles();
</script>
</body>
</html>
